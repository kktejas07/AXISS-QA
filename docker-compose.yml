# Local development stack. Production is deployed as two separate apps
# (see README) — this file is only for running everything on one machine.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: axiss_qa
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axiss_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./access-qa-360/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/axiss_qa
      CORS_ORIGIN: "*"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  landing:
    build: ./access-qa-360/landing
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./access-qa-360/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
