name: CI

# The Wiseflow app lives in access-qa-360/. Runs on every pull request and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: access-qa-360/backend
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: wiseflow
          POSTGRES_PASSWORD: wiseflow
          POSTGRES_DB: wiseflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wiseflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wiseflow:wiseflow@localhost:5432/wiseflow_test
      SYNC_DATABASE_URL: postgresql://wiseflow:wiseflow@localhost:5432/wiseflow_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-real-secret
      ANTHROPIC_API_KEY: ci-placeholder
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: access-qa-360/backend/requirements.txt
      - run: pip install -r requirements.txt
      # Every migration must apply to a real Postgres, then undo and re-apply cleanly.
      - name: Migrations up, down one, up
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: access-qa-360/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: access-qa-360/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
