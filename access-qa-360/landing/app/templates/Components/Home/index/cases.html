{% for item in cases %}
    <div class="px-5 pt-5 pb-6 md:pb-10 bg-blue rounded-20 border border-lineColor/70 relative group border-moving before:rounded-xl sm:before:rounded-2xl lg:before:rounded-[20px] z-1 useCase-card" data-sttr-card>
        <a href="{{ url_for('main.use_case_details') }}" class="" >
            <div class="flex items-center justify-between gap-5 ">
                <div class="w-10.5 h-10.5 flex items-center justify-center bg-primary rounded-[10px] p-2.5">
                    <svg class="fill-current text-white max-w-7 max-h-5">
                        <use href="{{ item.icon }}"></use>
                    </svg>
                </div>

                <div class="w-11 h-9 flex items-center justify-center bg-linear-to-b from-slateBlue/20 to-royalBlue/20 rounded-[10px] relative overflow-hidden">
                    <svg
                        class="w-6 h-6 fill-current text-white transition-all duration-300 ease-in-out group-hover:translate-x-6 group-hover:-translate-y-5 group-hover:opacity-0">
                        <use href="#arrowTopRight-icon"></use>
                    </svg>
                    <svg
                        class="w-6 h-6 fill-current text-white absolute transform -translate-x-6 translate-y-5 transition-all duration-300 ease-in-out group-hover:translate-x-0 group-hover:-translate-y-0 opacity-0 group-hover:opacity-100">
                        <use href="#arrowTopRight-icon"></use>
                    </svg>
                </div>
            </div>
            <h3 class="text-xl text-offWhite font-medium leading-normal mt-7.5">{{ item.title }}</h3>
            <div class="my-4 gradient-border w-full h-[1px]"></div>
            <p class="text-offWhite/60">{{ item.desc }}</p>
        </a>
    </div>
{% endfor %}
