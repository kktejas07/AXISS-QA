<div class="preloader-area fixed inset-0 w-screen h-screen z-[999999] overflow-hidden flex items-center justify-center">
    <div class="fixed z-[9999] top-1/2 -translate-y-1/2 left-1/2 -translate-x-1/2">
        <!-- Center Title -->
        <h4 class="loader-title text-white font-semibold !leading-[1.1] gradient-text lg:tracking-[1.8px] text-[32px] sm:text-5xl md:text-[52px] lg:text-[64px] overflow-hidden">
            ACCESS QA 360
        </h4>
        <!-- Progress Bar -->
        <div class="progress-bar mt-1 w-full h-[3px] bg-white/10 overflow-hidden rounded">
            <div class="progress-fill h-full bg-white w-[0%]"></div>
        </div>
    </div>
    <!-- Bottom Info -->
    <div class="loader-footer fixed bottom-6 z-[99999] left-0 right-0 flex flex-wrap justify-between px-5 sm:px-12 items-center text-white/80 text-sm font-light tracking-[3px] gap-5">
        <div class="loader-logo">
            <img src="{{ url_for('static', filename='assets/img/logo.svg') }}" alt="logo">
        </div>
        <div class="loader-percent">0%</div>
        <div class="loader-loading">Loading...</div>
    </div>
    <svg class="absolute top-1 left-0 w-full h-full loader-bg z-[70] opacity-0" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <defs>
            <clipPath id="waveClip">
                <path id="clip-wave" d="M0,0H1920V1080.5s-403.5-1-960-1-960,1-960,1Z"></path>
            </clipPath>
        </defs>

        <image
            href="{{ url_for('static', filename='assets/img/home/banner-bg.webp') }}"
            width="100%" height="100%"
            preserveAspectRatio="xMidYMid slice"
            clip-path="url(#waveClip)"
        ></image>
    </svg>

    <!-- Original Morph SVG on top (optional) -->
    <svg class="morph absolute bottom-0 left-0 w-full h-full z-[50]" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <path class="morph-me" d="M0,0H1920V1080.5s-403.5-1-960-1-960,1-960,1Z" fill="#0E1422"></path>
    </svg>
</div>
