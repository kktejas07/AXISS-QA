{% for item in filters %}
    <button class="integration-button w-auto lg:w-full cursor-pointer py-1.5 px-3 text-sm leading-normal tracking-[0.1px] text-white/60 rounded-[10px] border border-transparent transition-all duration-300 text-left {{ item.style }}" data-filter="{{ item.data }}" aria-pressed="{{ item.pressed }}">{{ item.title }}</button>
{% endfor %}
