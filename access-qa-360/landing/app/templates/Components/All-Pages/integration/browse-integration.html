{% for item in browse_integrations %}  
    <div data-sttr-card>
        <a href="{{ url_for('main.integration_details') }}"
            class="p-5 bg-blue rounded-20 border border-lineColor/70 relative group border-moving before:rounded-xl sm:before:rounded-2xl lg:before:rounded-[20px] z-1 useCase-card flex flex-col justify-between h-full">
            <div class="">
                <div class="flex items-center gap-4">
                    <span class="text-lg sm:text-xl text-white font-medium">{{ item.title }}</span>
                </div>
                <div class="mt-4 gradient-border w-full h-[1px]"></div>
                <p class="text-offWhite/60 mt-4">{{ item.desc }}</p>
            </div>
            <div class="mt-5 sm:mt-6 lg:mt-7.5 flex items-center justify-between gap-10">
                <span
                    class="bg-linear-to-b from-slateBlue/20 to-royalBlue/20 inline-flex items-center justify-center px-3 py-2 text-white font-medium text-sm leading-normal rounded-[10px] relative z-1 overflow-hidden text-center">{{ item.tools }}</span>
                <div
                    class="w-11 h-9 flex items-center justify-center bg-linear-to-b from-slateBlue/20 to-royalBlue/20 rounded-[10px] relative overflow-hidden">
                    <svg
                        class="w-6 h-6 fill-current text-white transition-all duration-300 ease-in-out group-hover:translate-x-6 group-hover:-translate-y-5 group-hover:opacity-0">
                        <use href="#arrowTopRight-icon"></use>
                    </svg>
                    <svg
                        class="w-6 h-6 fill-current text-white absolute transform -translate-x-6 translate-y-5 transition-all duration-300 ease-in-out group-hover:translate-x-0 group-hover:-translate-y-0 opacity-0 group-hover:opacity-100">
                        <use href="#arrowTopRight-icon"></use>
                    </svg>
                </div>
            </div>
        </a>
    </div>
{% endfor %}
