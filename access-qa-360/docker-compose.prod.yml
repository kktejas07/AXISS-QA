# Production stack for Wiseflow. See DEPLOY.md.
#
#   cp .env.production.example .env.production   # then fill it in
#   ./deploy.sh
#
# One public entry point: the "web" container serves the app and forwards /api to the API.

name: wiseflow

x-backend: &backend
  build: ./backend
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - storage:/app/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wiseflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-wiseflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wiseflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Applies database migrations, then exits. The API and worker wait for it.
  migrate:
    build: ./backend
    env_file: .env.production
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Optional: automatic HTTPS on a plain server. Not needed on Dokploy, Coolify or
  # anything else that already terminates TLS. Start with:  ./deploy.sh --tls
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to web:80
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  storage:
  caddy_data:
